<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detalhes do imóvel - Aluga Casa</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f6f8;
color:#222;
}

header{
background:#fff;
padding:16px 20px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:10;
}

.topo{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:23px;
font-weight:bold;
color:#1769aa;
}

.voltar{
border:0;
background:#eef5fb;
color:#1769aa;
padding:10px 14px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

main{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.galeria{
background:#dfe7ee;
border-radius:14px;
height:320px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
margin-bottom:22px;
}

.foto-grande{
font-size:90px;
}

.conteudo{
background:#fff;
border-radius:14px;
padding:24px;
box-shadow:0 2px 10px rgba(0,0,0,.07);
}

h1{
font-size:28px;
margin-bottom:10px;
}

.local{
color:#666;
margin-bottom:18px;
}

.preco{
font-size:26px;
font-weight:bold;
color:#1769aa;
margin-bottom:20px;
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:24px;
}

.item{
background:#f5f6f8;
padding:14px;
border-radius:9px;
text-align:center;
}

.item strong{
display:block;
font-size:18px;
margin-bottom:4px;
}

.descricao{
line-height:1.6;
color:#444;
margin-bottom:24px;
}

.descricao h2{
margin-bottom:10px;
}

.contato{
width:100%;
border:0;
background:#25D366;
color:#fff;
padding:14px;
border-radius:9px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.erro{
text-align:center;
background:#fff;
padding:35px;
border-radius:14px;
}

.erro h2{
margin-bottom:10px;
}

@media(max-width:600px){

.galeria{
height:230px;
}

.info{
grid-template-columns:1fr;
}

h1{
font-size:24px;
}

}

</style>
</head>

<body>

<header>

<div class="topo">

<div class="logo">
🏠 Aluga Casa
</div>

<button class="voltar" onclick="history.back()">
← Voltar
</button>

</div>

</header>

<main>

<div id="app"></div>

</main>

<script>

const imoveis = {

casa2:{
titulo:"Casa com 2 quartos",
local:"Juiz de Fora - MG",
preco:"R$ 1.200/mês",
quartos:"2 quartos",
banheiro:"1 banheiro",
extra:"1 vaga",
icone:"🏠",
descricao:"Casa para aluguel com 2 quartos, 1 banheiro e 1 vaga. Uma opção prática para quem procura moradia em Juiz de Fora."
},

apartamento:{
titulo:"Apartamento confortável",
local:"Juiz de Fora - MG",
preco:"R$ 1.350/mês",
quartos:"2 quartos",
banheiro:"1 banheiro",
extra:"Condomínio",
icone:"🏢",
descricao:"Apartamento confortável com 2 quartos, 1 banheiro e estrutura de condomínio. Ideal para quem busca praticidade."
},

kitnet:{
titulo:"Kitnet mobiliada",
local:"Juiz de Fora - MG",
preco:"R$ 800/mês",
quartos:"1 quarto",
banheiro:"1 banheiro",
extra:"Mobiliada",
icone:"🏡",
descricao:"Kitnet mobiliada para aluguel, com 1 quarto e 1 banheiro. Uma alternativa compacta para morar em Juiz de Fora."
}

};


/* ID DO IMÓVEL */

const id =
new URLSearchParams(window.location.search)
.get("imovel");


/* CARREGA ANÚNCIOS SALVOS */

let cadastrados=[];

try{

cadastrados=JSON.parse(
localStorage.getItem("alugaCasaImoveis") || "[]"
);

if(!Array.isArray(cadastrados)){
cadastrados=[];
}

}catch(e){

cadastrados=[];

}


/* PROCURA O IMÓVEL */

let imovel=imoveis[id];

if(!imovel){

imovel=cadastrados.find(function(item){

return String(item.id)===String(id);

});

}


/* MOSTRA NA TELA */

const app=document.getElementById("app");


if(!imovel){

app.innerHTML=`

<div class="erro">

<h2>Imóvel não encontrado</h2>

<p>
Não foi possível localizar este imóvel.
</p>

</div>

`;

}else{


let preco=String(imovel.preco || "");

if(!preco.includes("/mês")){
preco="R$ "+preco+"/mês";
}


let quartos=
imovel.quartos
? imovel.quartos+" quartos"
: "Não informado";


let banheiro=
imovel.banheiro
? imovel.banheiro+" banheiros"
: "Não informado";


let extra="Não informado";

if(imovel.extra){

extra=imovel.extra;

}else if(imovel.vagas){

extra=imovel.vagas+" vagas";

}


let descricao=
imovel.descricao ||
"Descrição não informada.";


let local="";

if(imovel.bairro){
local+=imovel.bairro+" - ";
}

local+=imovel.local || "";


app.innerHTML=`

<div class="galeria">

<div class="foto-grande">
${imovel.icone || "🏠"}
</div>

</div>


<div class="conteudo">

<h1>
${imovel.titulo || "Imóvel para aluguel"}
</h1>


<div class="local">
📍 ${local}
</div>


<div class="preco">
${preco}
</div>


<div class="info">

<div class="item">

<strong>🛏️</strong>

${quartos}

</div>


<div class="item">

<strong>🚿</strong>

${banheiro}

</div>


<div class="item">

<strong>⭐</strong>

${extra}

</div>

</div>


<div class="descricao">

<h2>
Sobre o imóvel
</h2>

<p>
${descricao}
</p>

</div>


<button class="contato" onclick="interesse()">

📱 Falar com o anunciante pelo WhatsApp

</button>

</div>

`;

}


/* WHATSAPP */

function interesse(){

if(!imovel){

alert("Imóvel não encontrado.");

return;

}


if(!imovel.contato){

alert(
"O anunciante não informou um número de WhatsApp."
);

return;

}


let numero=
String(imovel.contato)
.replace(/\D/g,"");


if(numero.startsWith("0")){

numero=numero.substring(1);

}


if(!numero.startsWith("55")){

numero="55"+numero;

}


if(numero.length < 12){

alert(
"O número de WhatsApp informado parece estar incompleto."
);

return;

}


window.location.href=
"https://wa.me/"+numero;

}

</script>

</body>

</html>
